# admin-layui 后台脚手架 — Nginx 反代示例（非运行配置，勿直接 include 进生产而不改）
#
# 用途：同域反代 + 对登录提交、验证码按 IP 限流，作为应用内 Redis 软拦的网关双保险。
# 应用默认：prod 监听 127.0.0.1:8081；页面 GET /login、提交 POST /login、验证码 GET /captcha/**
# 客户端 IP：必须把 X-Forwarded-For 传给后端（ServletUtils.getIP 取该头最左侧）
#
# 放置：limit_req_zone 必须在 http {} 内；server 可放到 conf.d/*.conf
# 本文件写成完整 http 片段便于阅读；实际部署请拆进现有 nginx.conf，并改 server_name / 上游端口。

http {
    # 10m 约可记大量 IP；rate 按「单 IP」计，与 sys_config 的 security.loginIpLim / capIpLim 不必相同
    # 网关层宜略宽于应用内阈值，避免正常刷新验证码先被 Nginx 429
    limit_req_zone $binary_remote_addr zone=md_login:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=md_captcha:10m rate=30r/m;

    upstream md_admin {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    server {
        listen 80;
        server_name example.com;   # 换成实际域名或内网主机名

        # 登录提交：只限 POST，避免挡登录页 GET
        location = /login {
            limit_except GET HEAD {
                limit_req zone=md_login burst=5 nodelay;
            }
            proxy_pass http://md_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 验证码（含受限兜底图）
        location /captcha/ {
            limit_req zone=md_captcha burst=10 nodelay;
            proxy_pass http://md_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://md_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 超限返回 429；应用内 Redis 超限仍由后端自己的文案 / 验证码兜底图处理
        limit_req_status 429;
    }
}
