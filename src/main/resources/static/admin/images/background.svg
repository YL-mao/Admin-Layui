      <circle cx="310" cy="48" r="0.7" opacity="0.18"><animate attributeName="opacity" values="0.06;0.28;0.1;0.22;0.06" dur="6.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="132" r="1" opacity="0.25"><animate attributeName="opacity" values="0.12;0.45;0.18;0.35;0.12" dur="4.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="72" r="0.8" opacity="0.2"><animate attributeName="opacity" values="0.08;0.32;0.12;0.26;0.08" dur="7.2s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="118" r="0.9" opacity="0.24"><animate attributeName="opacity" values="0.1;0.4;0.14;0.32;0.1" dur="5.8s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="1280" cy="56" r="0.7" opacity="0.17"><animate attributeName="opacity" values="0.05;0.26;0.09;0.2;0.05" dur="6.9s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="1520" cy="148" r="1.1" opacity="0.26"><animate attributeName="opacity" values="0.12;0.48;0.2;0.38;0.12" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="1760" cy="88" r="0.8" opacity="0.21"><animate attributeName="opacity" values="0.08;0.34;0.11;0.28;0.08" dur="5.5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="1880" cy="210" r="0.7" opacity="0.19"><animate attributeName="opacity" values="0.07;0.3;0.1;0.24;0.07" dur="7.8s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="280" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.08;0.36;0.12;0.3;0.08" dur="5.3s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="460" cy="340" r="0.8" opacity="0.18"><animate attributeName="opacity" values="0.06;0.28;0.1;0.22;0.06" dur="6.1s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="260" r="1" opacity="0.23"><animate attributeName="opacity" values="0.1;0.42;0.16;0.34;0.1" dur="4.8s" begin="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="380" r="0.7" opacity="0.16"><animate attributeName="opacity" values="0.05;0.24;0.08;0.18;0.05" dur="7.5s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="1240" cy="300" r="0.9" opacity="0.22"><animate attributeName="opacity" values="0.09;0.38;0.13;0.3;0.09" dur="5.6s" begin="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1500" cy="420" r="0.8" opacity="0.19"><animate attributeName="opacity" values="0.07;0.3;0.11;0.25;0.07" dur="6.3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="1780" cy="360" r="1" opacity="0.24"><animate attributeName="opacity" values="0.1;0.44;0.15;0.36;0.1" dur="4.9s" begin="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="520" r="0.8" opacity="0.17"><animate attributeName="opacity" values="0.06;0.26;0.09;0.2;0.06" dur="6.7s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="580" r="0.9" opacity="0.21"><animate attributeName="opacity" values="0.08;0.35;0.12;0.28;0.08" dur="5.4s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="480" r="0.7" opacity="0.15"><animate attributeName="opacity" values="0.04;0.22;0.07;0.16;0.04" dur="8.1s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="540" r="1" opacity="0.22"><animate attributeName="opacity" values="0.09;0.4;0.14;0.32;0.09" dur="5s" begin="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="620" r="0.8" opacity="0.18"><animate attributeName="opacity" values="0.06;0.28;0.1;0.22;0.06" dur="6.5s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1420" cy="500" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.08;0.34;0.11;0.28;0.08" dur="5.7s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="1680" cy="580" r="0.7" opacity="0.16"><animate attributeName="opacity" values="0.05;0.24;0.08;0.18;0.05" dur="7.3s" begin="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1860" cy="640" r="0.8" opacity="0.19"><animate attributeName="opacity" values="0.07;0.3;0.1;0.24;0.07" dur="6s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="740" r="0.9" opacity="0.2"><animate attributeName="opacity" values="0.08;0.36;0.12;0.3;0.08" dur="5.2s" begin="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="820" r="0.7" opacity="0.17"><animate attributeName="opacity" values="0.06;0.26;0.09;0.2;0.06" dur="6.8s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="760" r="1" opacity="0.23"><animate attributeName="opacity" values="0.1;0.42;0.16;0.34;0.1" dur="4.5s" begin="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="880" r="0.8" opacity="0.18"><animate attributeName="opacity" values="0.06;0.28;0.1;0.22;0.06" dur="6.2s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="1380" cy="800" r="0.9" opacity="0.21"><animate attributeName="opacity" values="0.08;0.35;0.12;0.28;0.08" dur="5.9s" begin="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="1640" cy="920" r="0.7" opacity="0.16"><animate attributeName="opacity" values="0.05;0.24;0.08;0.18;0.05" dur="7.6s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="980" r="0.8" opacity="0.19"><animate attributeName="opacity" values="0.07;0.3;0.1;0.24;0.07" dur="6.4s" begin="3.7s" repeatCount="indefinite"/></circle>
