    <g filter="url(#star-blur)">
      <use href="#star-4" x="420" y="120" width="7" height="7" opacity="0.32"><animate attributeName="opacity" values="0.12;0.5;0.2;0.42;0.12" dur="5.5s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="1180" y="200" width="6" height="6" opacity="0.28"><animate attributeName="opacity" values="0.1;0.44;0.16;0.36;0.1" dur="6.2s" begin="1.1s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="1680" y="320" width="8" height="8" opacity="0.34"><animate attributeName="opacity" values="0.14;0.55;0.22;0.48;0.14" dur="4.8s" begin="2.3s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="280" y="480" width="6" height="6" opacity="0.26"><animate attributeName="opacity" values="0.08;0.4;0.14;0.32;0.08" dur="7.1s" begin="0.6s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="920" y="420" width="7" height="7" opacity="0.3"><animate attributeName="opacity" values="0.11;0.48;0.18;0.4;0.11" dur="5.9s" begin="3.2s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="1420" y="680" width="6" height="6" opacity="0.27"><animate attributeName="opacity" values="0.09;0.42;0.15;0.34;0.09" dur="6.5s" begin="1.8s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="620" y="860" width="7" height="7" opacity="0.31"><animate attributeName="opacity" values="0.1;0.46;0.17;0.38;0.1" dur="5.3s" begin="2.9s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="1320" y="920" width="5" height="5" opacity="0.24"><animate attributeName="opacity" values="0.08;0.36;0.12;0.28;0.08" dur="7.4s" begin="0.4s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="820" y="140" width="6" height="6" opacity="0.29"><animate attributeName="opacity" values="0.1;0.45;0.16;0.38;0.1" dur="6s" begin="1.5s" repeatCount="indefinite"/></use>
      <use href="#star-4" x="1520" y="780" width="6" height="6" opacity="0.28"><animate attributeName="opacity" values="0.09;0.42;0.14;0.35;0.09" dur="6.8s" begin="3.5s" repeatCount="indefinite"/></use>
    </g>

    <!-- 流星：少量、慢速、柔尾；右上 → 左下 -->
    <g id="meteors" filter="url(#trail-soft)">
      <g opacity="0">
        <line x1="0" y1="0" x2="260" y2="-168" stroke="url(#trail-a)" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#star-4" x="-6" y="-6" width="12" height="12" filter="url(#star-blur)" opacity="0.85"/>
        <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.35;0.42;0.58;0.65;1" dur="14s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="2200 -80; -320 1160" dur="14s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <line x1="0" y1="0" x2="220" y2="-142" stroke="url(#trail-b)" stroke-width="1.1" stroke-linecap="round"/>
        <use href="#star-4" x="-5" y="-5" width="10" height="10" filter="url(#star-blur)" opacity="0.8"/>
        <animate attributeName="opacity" values="0;0;0.5;0.5;0;0" keyTimes="0;0.38;0.45;0.55;0.62;1" dur="16s" begin="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="2350 60; -280 1100" dur="16s" begin="5s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <line x1="0" y1="0" x2="300" y2="-195" stroke="url(#trail-a)" stroke-width="1.6" stroke-linecap="round"/>
        <use href="#star-4" x="-6" y="-6" width="11" height="11" filter="url(#star-blur)" opacity="0.82"/>
        <animate attributeName="opacity" values="0;0;0.52;0.52;0;0" keyTimes="0;0.36;0.43;0.57;0.64;1" dur="15s" begin="11s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="2100 -40; -400 1220" dur="15s" begin="11s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <line x1="0" y1="0" x2="200" y2="-128" stroke="url(#trail-b)" stroke-width="1" stroke-linecap="round"/>
        <use href="#star-4" x="-5" y="-5" width="9" height="9" filter="url(#star-blur)" opacity="0.75"/>
        <animate attributeName="opacity" values="0;0;0.45;0.45;0;0" keyTimes="0;0.4;0.47;0.53;0.6;1" dur="13s" begin="18s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="2280 160; -220 1040" dur="13s" begin="18s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <line x1="0" y1="0" x2="280" y2="-182" stroke="url(#trail-a)" stroke-width="1.3" stroke-linecap="round"/>
        <use href="#star-4" x="-6" y="-6" width="10" height="10" filter="url(#star-blur)" opacity="0.78"/>
        <animate attributeName="opacity" values="0;0;0.48;0.48;0;0" keyTimes="0;0.37;0.44;0.56;0.63;1" dur="17s" begin="24s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="2480 20; -360 1180" dur="17s" begin="24s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
