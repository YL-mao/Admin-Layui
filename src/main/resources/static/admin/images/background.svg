<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="night" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#141c30" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#060910" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail-a" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e8a820" stop-opacity="0"/>
      <stop offset="35%" stop-color="#d4a017" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff0c8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="trail-b" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c99212" stop-opacity="0"/>
      <stop offset="40%" stop-color="#e8b830" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9e0"/>
      <stop offset="55%" stop-color="#ffd95a"/>
      <stop offset="100%" stop-color="#e8a820"/>
    </radialGradient>
    <filter id="star-blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="trail-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <symbol id="star-4" viewBox="0 0 24 24">
      <path fill="url(#star-glow)" d="M12 2 L13.2 10.8 L22 12 L13.2 13.2 L12 22 L10.8 13.2 L2 12 L10.8 10.8 Z"/>
    </symbol>
    <clipPath id="sky-clip">
      <rect width="1920" height="1080"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sky-clip)">
    <rect width="1920" height="1080" fill="url(#night)"/>
    <rect width="1920" height="1080" fill="url(#haze)"/>

