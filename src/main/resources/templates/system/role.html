<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sa="https://www.thymeleaf.org/extras/sa-token">
<head th:replace="~{include :: header('角色管理')}"></head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">角色名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="roleName" maxlength="64" placeholder="请输入角色名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="role-query">
                        <i class="layui-icon layui-icon-search"></i>
                        查询
                    </button>
                    <button type="reset" class="pear-btn pear-btn-md">
                        <i class="layui-icon layui-icon-refresh"></i>
                        重置
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="role-table" lay-filter="role-table"></table>
    </div>
</div>

<script type="text/html" id="role-toolbar">
    <button sa:hasPermission="system:role:insert" class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增
    </button>
    <button sa:hasPermission="system:role:delete" class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove">
        <i class="layui-icon layui-icon-delete"></i>
        删除
    </button>
</script>

<script type="text/html" id="role-bar">
    <button sa:hasPermission="system:role:update" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="edit"><i class="layui-icon layui-icon-edit"></i></button>
    <button sa:hasPermission="system:role:auth" class="pear-btn pear-btn-warming pear-btn-sm" lay-event="power"><i class="layui-icon layui-icon-vercode"></i></button>
    <button sa:hasPermission="system:role:delete" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="remove"><i class="layui-icon layui-icon-delete"></i></button>
</script>

<script type="text/html" id="role-enable" th:inline="none">
{{# if(d.isEnabled == 1){ }}
    <input sa:hasPermission="system:role:updateEnabled" type="checkbox" name="isEnabled" value="{{d.roleId}}" lay-skin="switch" lay-text="启用|停用" lay-filter="role-enable" checked />
{{# } else { }}
    <input sa:hasPermission="system:role:updateEnabled" type="checkbox" name="isEnabled" value="{{d.roleId}}" lay-skin="switch" lay-text="启用|停用" lay-filter="role-enable" />
{{# } }}
</script>

<script type="text/html" id="role-form">
    <form class="layui-form" lay-filter="role-form" action="">
        <div class="mainBox">
            <div class="main-container">
                <input type="hidden" name="roleId">
                <div class="layui-form-item">
                    <label class="layui-form-label">角色名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="roleName" lay-verify="required" maxlength="64" placeholder="请输入角色名称" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">角色编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="roleCode" lay-verify="required|codeFormat" maxlength="64" placeholder="请输入角色编码" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="orderNum" lay-verify="required|number" placeholder="请输入排序号"
                               autocomplete="off" class="layui-input" value="1">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="isEnabled" value="1" title="启用">
                        <input type="radio" name="isEnabled" value="0" title="停用" checked>
                    </div>
                </div>
            </div>
        </div>
        <div class="bottom">
            <div class="button-container">
                <button sa:hasPermissionOr="system:role:insert,system:role:update" type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit lay-filter="role-save">
                    <i class="layui-icon layui-icon-ok"></i>
                    提交
                </button>
                <button type="button" class="pear-btn pear-btn-sm" onclick="closeCurrentLayer()">
                    <i class="layui-icon layui-icon-close"></i>
                    关闭
                </button>
            </div>
        </div>
    </form>
</script>

<script type="text/html" id="role-perm-panel">
    <div>
        <div class="mainBox">
            <div class="main-container">
                <!-- 授权树工具栏：展开/折叠改显示，全选/清空改勾选，不改基准数据 -->
                <div class="layui-btn-container" style="margin-bottom: 12px;">
                    <button type="button" class="pear-btn pear-btn-sm" id="role-perm-expand">
                        <i class="layui-icon layui-icon-spread-left"></i>
                        展开
                    </button>
                    <button type="button" class="pear-btn pear-btn-sm" id="role-perm-collapse">
                        <i class="layui-icon layui-icon-shrink-right"></i>
                        折叠
                    </button>
                    <button type="button" class="pear-btn pear-btn-sm" id="role-perm-check-all">
                        <i class="layui-icon layui-icon-ok"></i>
                        全选
                    </button>
                    <button type="button" class="pear-btn pear-btn-sm" id="role-perm-check-none">
                        <i class="layui-icon layui-icon-close"></i>
                        清空
                    </button>
                </div>
                <div id="role-perm-tree"></div>
            </div>
        </div>
        <div class="bottom">
            <div class="button-container">
                <button sa:hasPermission="system:role:auth" type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="role-perm-submit">
                    <i class="layui-icon layui-icon-ok"></i>
                    提交
                </button>
                <button type="button" class="pear-btn pear-btn-sm" id="role-perm-reset">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </div>
    </div>
</script>

<th:block th:insert="~{include :: footer}"/>
<script>
    layui.use(['common', 'table', 'form', 'jquery', 'layer', 'tree'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;
        let layer = layui.layer;
        let tree = layui.tree;
        let MODULE_PATH = apiPath + "/role";
        let PERM_PATH = apiPath + "/perm";
        let formMode = 'add';
        let currentRoleLayerIndex = null;

        form.verify({
            codeFormat: function (value) {
                // 普通编码只允许字母、数字、下划线和中划线。
                if (value && !/^[A-Za-z0-9_-]+$/.test(value)) {
                    return '编码只能包含字母、数字、下划线和中划线';
                }
            }
        });

        // 列数较少时不设 width，由 Layui table 按内容自适应列宽。
        let cols = [
            [
                {type: 'checkbox'},
                {title: '角色名称', field: 'roleName', align: 'center'},
                {title: '角色编码', field: 'roleCode', align: 'center'},
                {title: '排序', field: 'orderNum', align: 'center'},
                {title: '状态', field: 'isEnabled', align: 'center', templet: '#role-enable'},
                {title: '操作', toolbar: '#role-bar', align: 'center'}
            ]
        ];

        // 从后台分页加载角色列表。
        table.render({
            response: TABLE_RESPONSE,
            elem: '#role-table',
            url: MODULE_PATH + '/list',
            page: true,
            cols: cols,
            skin: 'line',
            toolbar: '#role-toolbar',
            defaultToolbar: [{
                title: '刷新',
                layEvent: 'refresh',
                icon: 'layui-icon-refresh',
            }, 'filter', 'print', 'exports']
        });

        table.on('tool(role-table)', function (obj) {
            if (obj.event === 'remove') {
                window.remove(obj);
            } else if (obj.event === 'edit') {
                window.edit(obj);
            } else if (obj.event === 'power') {
                window.power(obj);
            }
        });

        table.on('toolbar(role-table)', function (obj) {
            if (obj.event === 'add') {
                window.add();
            } else if (obj.event === 'refresh') {
                window.refresh();
            } else if (obj.event === 'batchRemove') {
                window.batchRemove(obj);
            }
        });

        form.on('submit(role-query)', function (data) {
            table.reload('role-table', {where: data.field});
            return false;
        });

        form.on('switch(role-enable)', function (obj) {
            // isEnabled 使用布尔语义，1 表示启用，0 表示停用。
            let isEnabled = obj.elem.checked ? 1 : 0;
            // 调用后台切换角色启停状态。
            patchJson(MODULE_PATH + '/updateEnabled', {
                roleId: this.value,
                isEnabled: isEnabled
            }, {
                defaultMsg: '状态更新失败',
                success: function (result) {
                    if (isAjaxSuccess(result)) {
                        layer.msg(result.msg, {icon: 1, time: 1000});
                    } else {
                        obj.elem.checked = !obj.elem.checked;
                        form.render('checkbox');
                        layer.msg(result.msg || '状态更新失败', {icon: 2, time: 1000});
                    }
                },
                error: function () {
                    obj.elem.checked = !obj.elem.checked;
                    form.render('checkbox');
                }
            });
        });

        function checkRoleNameUnique(roleName, callback) {
            // 调用后台校验角色名称是否已存在。
            checkUnique(MODULE_PATH + '/checkName', {roleName: roleName}, callback);
        }

        function checkRoleCodeUnique(roleCode, callback) {
            // 调用后台校验角色编码是否已存在。
            checkUnique(MODULE_PATH + '/checkCode', {roleCode: roleCode}, callback);
        }

        // 将角色授权接口返回的平铺权限列表转为 Layui tree 节点，默认全部折叠。
        function buildRolePermTree(list, parentId) {
            let nodes = [];
            list.forEach(function (item) {
                if (String(item.parentId) === String(parentId)) {
                    let children = buildRolePermTree(list, item.permId);
                    let node = {
                        id: item.permId,
                        title: item.permName,
                        checked: String(item.checkArr) === '1'
                    };
                    if (children.length) {
                        node.children = children;
                        node.spread = false;
                    }
                    nodes.push(node);
                }
            });
            return nodes;
        }

        function cloneRolePermTree(nodes) {
            return (nodes || []).map(function (node) {
                let cloned = {
                    id: node.id,
                    title: node.title,
                    checked: node.checked
                };
                if (node.children && node.children.length) {
                    cloned.children = cloneRolePermTree(node.children);
                    cloned.spread = !!node.spread;
                }
                return cloned;
            });
        }

        function setRolePermTreeSpread(nodes, spread) {
            (nodes || []).forEach(function (node) {
                if (node.children && node.children.length) {
                    node.spread = spread;
                    setRolePermTreeSpread(node.children, spread);
                }
            });
        }

        function collectRolePermCheckedIds(nodes, ids) {
            ids = ids || [];
            (nodes || []).forEach(function (node) {
                ids.push(node.id);
                collectRolePermCheckedIds(node.children, ids);
            });
            return ids;
        }

        // 收集树上全部节点 id，供「全选」一次性勾选。
        function collectAllRolePermIds(nodes, ids) {
            ids = ids || [];
            (nodes || []).forEach(function (node) {
                ids.push(node.id);
                collectAllRolePermIds(node.children, ids);
            });
            return ids;
        }

        function applyRolePermChecked(nodes, checkedIdSet) {
            (nodes || []).forEach(function (node) {
                node.checked = checkedIdSet.has(String(node.id));
                if (node.children && node.children.length) {
                    applyRolePermChecked(node.children, checkedIdSet);
                }
            });
        }

        // 通过 reload 回写勾选状态；Layui tree.setChecked 传空数组无法清空勾选。
        function reloadRolePermTreeChecked(treeId, baseData, checkedIdSet, spread) {
            let data = cloneRolePermTree(baseData);
            if (spread !== undefined) {
                setRolePermTreeSpread(data, spread);
            }
            applyRolePermChecked(data, checkedIdSet);
            tree.reload(treeId, {data: data});
        }

        // 展开/折叠时保留当前勾选，只改节点 spread 状态。
        function reloadRolePermTree(treeId, baseData, spread) {
            let checkedIdSet = new Set(collectRolePermCheckedIds(tree.getChecked(treeId)).map(String));
            reloadRolePermTreeChecked(treeId, baseData, checkedIdSet, spread);
        }

        // 从授权查询接口平铺列表提取已勾选权限 ID，供回显使用。
        function getRolePermCheckedIdsFromList(list) {
            return (list || []).filter(function (item) {
                return String(item.checkArr) === '1';
            }).map(function (item) {
                return item.permId;
            });
        }

        function applyRolePermTreeChecked(treeId, checkedIds) {
            if (!checkedIds || !checkedIds.length) {
                return;
            }
            setTimeout(function () {
                tree.setChecked(treeId, checkedIds);
            }, 0);
        }

        // 渲染授权树，并返回树结构与打开时的勾选快照（重置依赖快照）。
        function renderRolePermTree(elem, treeId, list) {
            let rolePermTreeData = buildRolePermTree(list, '0');
            let checkedIds = getRolePermCheckedIdsFromList(list);
            tree.render({
                elem: elem,
                id: treeId,
                data: cloneRolePermTree(rolePermTreeData),
                showCheckbox: true,
                showLine: true
            });
            applyRolePermTreeChecked(treeId, checkedIds);
            return {
                treeData: rolePermTreeData, // 仅含层级与标题，全选/清空都基于此结构 reload
                checkedIdSet: new Set(checkedIds.map(String)) // 当前角色已授权节点，重置时恢复
            };
        }

        function saveRolePerm(roleId, treeId, callback) {
            let permIds = collectRolePermCheckedIds(tree.getChecked(treeId)).join(',');
            let loading = layer.load();
            // 调用后台保存当前角色的权限授权。
            putJson(PERM_PATH + '/rolePerm', {
                roleId: roleId,
                permIds: permIds
            }, {
                defaultMsg: '授权保存失败',
                success: function (result) {
                    layer.close(loading);
                    if (isAjaxSuccess(result)) {
                        layer.msg(result.msg || '授权保存成功', {icon: 1, time: 1000}, function () {
                            if (typeof callback === 'function') {
                                callback();
                            }
                        });
                    } else {
                        layer.msg(result.msg || '授权保存失败', {icon: 2, time: 1000});
                    }
                },
                error: function () {
                    layer.close(loading);
                }
            });
        }

        function saveRole(data) {
            let loading = layer.load();
            // 按表单是否带角色 ID 决定新增或修改角色。
            (data.field.roleId ? putJson : postJson)(MODULE_PATH + (data.field.roleId ? '/update' : '/add'), data.field, {
                defaultMsg: '操作失败',
                success: function (result) {
                    layer.close(loading);
                    if (isAjaxSuccess(result)) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            layer.closeAll('page');
                            table.reload('role-table');
                        });
                    } else {
                        layer.msg(result.msg || '操作失败', {icon: 2, time: 1000});
                    }
                },
                error: function () {
                    layer.close(loading);
                }
            });
        }

        form.on('submit(role-save)', function (data) {
            let $form = $(data.form);
            let originalRoleName = $form.find('[name="roleName"]').attr('data-original-role-name');
            let originalRoleCode = $form.find('[name="roleCode"]').attr('data-original-role-code');
            let nameUnchanged = data.field.roleId && originalRoleName === data.field.roleName;
            let codeUnchanged = data.field.roleId && originalRoleCode === data.field.roleCode;

            function checkCodeThenSave() {
                if (codeUnchanged) {
                    saveRole(data);
                    return;
                }
                checkRoleCodeUnique(data.field.roleCode, function (unique) {
                    if (unique) {
                        saveRole(data);
                    } else {
                        layer.msg('角色编码已存在', {icon: 2, time: 1000});
                    }
                });
            }

            if (nameUnchanged) {
                checkCodeThenSave();
                return false;
            }
            checkRoleNameUnique(data.field.roleName, function (unique) {
                if (unique) {
                    checkCodeThenSave();
                } else {
                    layer.msg('角色名称已存在', {icon: 2, time: 1000});
                }
            });
            return false;
        });

	        function openRoleForm(mode, row) {
	            formMode = mode;
	            // 保存当前角色抽屉索引，关闭按钮只关闭当前抽屉。
	            currentRoleLayerIndex = layer.open({
	                type: 1,
	                title: mode === 'add' ? '新增角色' : '修改角色',
                offset: mode === 'add' ? 'b' : 'r',
                anim: mode === 'add' ? 'slideUp' : 'slideLeft',
                shade: 0.1,
                shadeClose: true,
                id: mode === 'add' ? 'role-add-layer' : 'role-edit-layer',
                area: mode === 'add' ? ['800px', '70%'] : ['500px', '40%'],
                content: $('#role-form').html(),
                success: function (layero) {
                    form.render();
                    if (mode === 'edit' && row) {
                        layero.find('[name="roleName"]').attr('data-original-role-name', row.roleName);
                        layero.find('[name="roleCode"]').attr('data-original-role-code', row.roleCode);
                        form.val('role-form', {
                            roleId: row.roleId,
                            roleName: row.roleName,
                            roleCode: row.roleCode,
                            orderNum: row.orderNum,
                            isEnabled: String(row.isEnabled != null ? row.isEnabled : 1)
                        });
                    } else {
                        form.val('role-form', {
                            roleId: '',
                            roleName: '',
                            roleCode: '',
                            orderNum: 1,
                            isEnabled: '0'
                        });
                    }
                }
            });
        }

        window.add = function () {
            openRoleForm('add', null);
        };

	        window.closeCurrentLayer = function () {
	            layer.close(currentRoleLayerIndex);
	        };

        window.edit = function (obj) {
            openRoleForm('edit', obj.data);
        };

        window.power = function (obj) {
            let rolePermLayerIndex = layer.open({
                type: 1,
                title: '授权角色',
                offset: 'r',
                anim: 'slideLeft',
                shade: 0.1,
                shadeClose: true,
                area: ['500px', '100%'],
                id: 'role-perm-layer',
                content: $('#role-perm-panel').html(),
                success: function (layero) {
                    let roleId = obj.data.roleId;
                    let rolePermTreeId = 'role-perm-tree-' + roleId;
                    // 树结构固定不变；勾选快照仅在打开抽屉时记录，供重置使用。
                    let rolePermBaseTreeData = [];
                    let rolePermOriginalCheckedIds = new Set();
                    let loading = layer.load();
                    // 调用后台加载角色已勾选的权限树。
                    getJson(PERM_PATH + '/rolePermTree', {roleId: roleId}, {
                        defaultMsg: '加载权限树失败',
                        success: function (result) {
                            layer.close(loading);
                            if (!isAjaxSuccess(result)) {
                                layer.msg(result.msg || '加载权限树失败', {icon: 2, time: 1000});
                                return;
                            }
                            let list = result.data || [];
                            let rolePermSnapshot = renderRolePermTree(
                                layero.find('#role-perm-tree')[0],
                                rolePermTreeId,
                                list
                            );
                            rolePermBaseTreeData = rolePermSnapshot.treeData;
                            rolePermOriginalCheckedIds = rolePermSnapshot.checkedIdSet;
                        },
                        error: function () {
                            layer.close(loading);
                        }
                    });
                    layero.find('#role-perm-submit').on('click', function () {
                        if (!rolePermBaseTreeData.length) {
                            return;
                        }
                        saveRolePerm(roleId, rolePermTreeId, function () {
                            layer.close(rolePermLayerIndex);
                            // 授权变更后刷新顶层页面，重新拉取侧边栏菜单。
                            top.location.reload();
                        });
                    });
                    layero.find('#role-perm-expand').on('click', function () {
                        if (!rolePermBaseTreeData.length) {
                            return;
                        }
                        reloadRolePermTree(rolePermTreeId, rolePermBaseTreeData, true);
                    });
                    layero.find('#role-perm-collapse').on('click', function () {
                        if (!rolePermBaseTreeData.length) {
                            return;
                        }
                        reloadRolePermTree(rolePermTreeId, rolePermBaseTreeData, false);
                    });
                    layero.find('#role-perm-check-all').on('click', function () {
                        if (!rolePermBaseTreeData.length) {
                            return;
                        }
                        // 勾选全部节点，不修改打开时的授权快照。
                        let allIdSet = new Set(collectAllRolePermIds(rolePermBaseTreeData).map(String));
                        reloadRolePermTreeChecked(rolePermTreeId, rolePermBaseTreeData, allIdSet);
                    });
                    layero.find('#role-perm-check-none').on('click', function () {
                        if (!rolePermBaseTreeData.length) {
                            return;
                        }
                        // 传空 Set 通过 reload 清空勾选，setChecked([]) 无效。
                        reloadRolePermTreeChecked(rolePermTreeId, rolePermBaseTreeData, new Set());
                    });
                    layero.find('#role-perm-reset').on('click', function () {
                        if (!rolePermBaseTreeData.length) {
                            return;
                        }
                        // 恢复到打开抽屉时该角色已有的授权勾选。
                        reloadRolePermTreeChecked(rolePermTreeId, rolePermBaseTreeData, rolePermOriginalCheckedIds);
                    });
                }
            });
        };

        window.remove = function (obj) {
            layer.confirm('确定要删除该角色吗？', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                // 调用后台删除当前角色。
                deleteJson(MODULE_PATH + '/delete', {ids: obj.data.roleId}, {
                    defaultMsg: '删除失败',
                    success: function (result) {
                        layer.close(loading);
                        if (isAjaxSuccess(result)) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                obj.del();
                            });
                        } else {
                            layer.msg(result.msg || '删除失败', {icon: 2, time: 1000});
                        }
                    },
                    error: function () {
                        layer.close(loading);
                    }
                });
            });
        };

        window.batchRemove = function (obj) {
            let ids = getCheckedFieldIds(obj, 'roleId');
            if (ids === '') {
                layer.msg('未选中数据', {icon: 3, time: 1000});
                return false;
            }
            layer.confirm('确定要删除这些角色吗？', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                // 调用后台批量删除选中的角色。
                deleteJson(MODULE_PATH + '/delete', {ids: ids}, {
                    defaultMsg: '删除失败',
                    success: function (result) {
                        layer.close(loading);
                        if (isAjaxSuccess(result)) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                table.reload('role-table');
                            });
                        } else {
                            layer.msg(result.msg || '删除失败', {icon: 2, time: 1000});
                        }
                    },
                    error: function () {
                        layer.close(loading);
                    }
                });
            });
        };

        window.refresh = function () {
            table.reload('role-table');
        };
    });
</script>
</body>
</html>
